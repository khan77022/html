<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="upper">
        <div class="inner">
            <div class="inner2">
                <div class="inner3">

                </div>
            </div>

        </div>

    </div>
    <style>
        .upper{
            height: 90vh;
            background-color: rgb(173, 147, 116);
            display: flex;
            justify-content: center;
            align-items: center;
            align-content: center;
        }
        .inner{
            height: 300px;
            width: 300px;
            background-color: rgba(46, 26, 26, 0.849);
            border-radius: 50%;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            align-content: center;
            transition: width 1s ease 0s,height 1s ease 0s,background-color 1s ease 0s;
            cursor: pointer;


        }
        .inner2{
            height: 200px;
            width: 200px;
            background-color: rgba(165, 42, 42, 0.685);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            align-content: center;
            transition: width 1s ease 0s,height 1s ease 0s,background-color 1s ease 0s;
            cursor: pointer;
        }
        .inner3{
            height: 100px;
            width: 100px;
            background-color: rgba(255, 255, 255, 0.678);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            align-content: center;
            transition: width 1s ease 0s,height 1s ease 0s,background-color 1s ease 0s;
            cursor: pointer;
        }
        .inner:hover{
            width: 500px;
            height: 500px;
            background-color: rgb(0, 0, 0);
        }
        .inner2:hover{
            width: 400px;
            height: 400px;
            background-color: brown;
        }
        .inner3:hover{
            width: 300px;
            height: 300px;
            background-color: rgb(255, 255, 255);
        }
    </style>
</body>
</html>
