<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="box" id="b1"></div>
        <div class="box" id="b2"></div>
        <div class="box" id="b3"></div>
        <div class="box" id="b4"></div>
        
    </div>
    <style>
        .container{
            height: 90vh;
            background-color: bisque;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .box{
            height: 50px;
            width: 50px;
            background-color: rgb(255, 255, 255);
            border: 2px solid rgb(0, 0, 0);
            transition: transform 1s ease 0s, height 1s ease 0s,width 1s ease 0s, background-color 1s ease 0s;
            border-radius: 50px;
            



        }
        .box:hover{
            
            transform: rotate(135deg);
            transition-timing-function: ease;
            width: 200px;
            height: 200px;
            border-radius: 0;
            background-color: black;
            cursor: pointer;
            
            

        }
        #b1:hover{
            background-color: hsla(0, 100%, 50%, 0.863);
        }
         #b2:hover{
            background-color: hsla(32, 100%, 50%, 0.863);
        }
         #b3:hover{
            background-color: hsla(51, 100%, 50%, 0.863);
        }
         #b4:hover{
            background-color: hsla(81, 100%, 50%, 0.863);
        }
    </style>
</body>
</html>
